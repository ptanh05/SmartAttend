name: SmartAttend CI/CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Typecheck, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-mock-session-secret-at-least-32-chars-long' }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID || 'common' }}
